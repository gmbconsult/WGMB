backend:
  name: github
  repo: gmbconsult/WGMB
  branch: main

media_folder: images
public_folder: images

locale: en

collections:

  # ── SITE SETTINGS ──
  - name: settings
    label: "⚙️ Site Settings"
    files:
      - name: general
        label: "General Settings"
        file: site-data.json
        fields:
          - label: "Site"
            name: site
            widget: object
            fields:
              - { label: "Business Name", name: name, widget: string }
              - { label: "Tagline", name: tagline, widget: string }
              - { label: "Email", name: email, widget: string }
              - { label: "Phone 1", name: phone1, widget: string }
              - { label: "Phone 2", name: phone2, widget: string }
              - { label: "Address", name: address, widget: string }

          - label: "Header"
            name: header
            widget: object
            fields:
              - { label: "Announcement Bar Text", name: announcement, widget: string, required: false }

          - label: "Footer"
            name: footer
            widget: object
            fields:
              - { label: "Footer Description", name: description, widget: text }
              - { label: "Copyright Text", name: copyright, widget: string }
              - label: "Social Links"
                name: socialLinks
                widget: object
                fields:
                  - { label: "Facebook URL", name: facebook, widget: string, required: false }
                  - { label: "Instagram URL", name: instagram, widget: string, required: false }
                  - { label: "YouTube URL", name: youtube, widget: string, required: false }

          - label: "Stats"
            name: stats
            widget: list
            fields:
              - { label: "Number", name: number, widget: string }
              - { label: "Label", name: label, widget: string }

          - label: "Testimonials"
            name: testimonials
            widget: list
            fields:
              - { label: "Customer Name", name: name, widget: string }
              - { label: "Business", name: business, widget: string }
              - { label: "Review Text", name: text, widget: text }
              - { label: "Rating (1-5)", name: rating, widget: number, min: 1, max: 5 }

          - label: "FAQs"
            name: faqs
            widget: list
            fields:
              - { label: "Question", name: q, widget: string }
              - { label: "Answer", name: a, widget: text }

  # ── PRODUCTS ──
  - name: products
    label: "📦 Products & Services"
    folder: _products
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: name, widget: string }
      - { label: "Price", name: price, widget: string, hint: "e.g. ₹4,999/year" }
      - { label: "Featured on Homepage?", name: featured, widget: boolean, default: true }
      - { label: "Product Image", name: image, widget: image }
      - { label: "Short Description", name: description, widget: text }
      - label: "Features List"
        name: features
        widget: list
        field: { label: Feature, name: feature, widget: string }
      - { label: "Buy Now Link", name: buyLink, widget: string, required: false, hint: "WhatsApp or payment link" }

  # ── PAGES ──
  - name: pages
    label: "📄 Pages"
    folder: _pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page Title", name: title, widget: string }
      - { label: "URL Slug", name: slug, widget: string, hint: "e.g. about-us (no spaces)" }
      - { label: "Show in Menu?", name: showInMenu, widget: boolean, default: true }
      - { label: "Menu Label", name: menuLabel, widget: string }
      - { label: "Parent Page (for dropdown)", name: parent, widget: string, required: false }
      - { label: "Hero Image", name: heroImage, widget: image, required: false }
      - { label: "Page Content", name: body, widget: markdown }
      - label: "SEO"
        name: seo
        widget: object
        fields:
          - { label: "Meta Title", name: title, widget: string, required: false }
          - { label: "Meta Description", name: description, widget: text, required: false }

  # ── HOME PAGE ──
  - name: homepage
    label: "🏠 Home Page"
    files:
      - name: hero
        label: "Hero Section"
        file: _data/hero.json
        fields:
          - { label: "Hero Badge Text", name: badge, widget: string }
          - { label: "Main Heading Line 1", name: heading1, widget: string }
          - { label: "Main Heading Line 2", name: heading2, widget: string }
          - { label: "Main Heading Highlight", name: headingHighlight, widget: string }
          - { label: "Subtext", name: subtext, widget: text }
          - { label: "Primary Button Text", name: btnPrimary, widget: string }
          - { label: "Secondary Button Text", name: btnSecondary, widget: string }
          - { label: "Hero Background Image", name: heroBg, widget: image, required: false }
          - { label: "About Section Image", name: aboutImage, widget: image, required: false }
          - { label: "About Heading", name: aboutHeading, widget: string }
          - { label: "About Text", name: aboutText, widget: text }
          - { label: "Video Embed URL (YouTube)", name: videoUrl, widget: string, required: false, hint: "YouTube embed URL" }
          - { label: "Section: About Title", name: aboutTitle, widget: string }
